  <!--Custom CSS-->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="media/elephant_icon.png" />
</head>

<body class="bg-c-light d-flex flex-column min-vh-100">
  <!--Navbar start-->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: var(--c-primary)">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <a href="index.html"><span><img src="media/logo1.png" width="40px" class="me-2 my-1"></span></a>
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link text-light" href="index.html">Homepage</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light" href="biomes.html">Biomes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light" href="threats.html">Threats</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light" href="conservation.html">Conservation</a>
            </li>
            <li class="nav-item active">
              <a class="nav-link text-light" href="contact.html">Contact Us</a>
            </li>
          </ul>
        </div>
      </div>
      <!-- Search Bar on the right side -->
      <form class="d-flex me-2" onsubmit="handleSearch(event)">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"
          style="background-color: var(--c-light); color: var(--c-primary)" />
        <button class="btn btn-sm" type="submit" style="background-color: var(--c-secondary); color: var(--c-light)">
          Search
        </button>
      </form>
  </nav>
  <!--Navbar end-->

  <!--Content container start-->
  <div class="contact-container mt-5 flex-grow-1">
    
    <div class="row">
     <!-- Contact Form Start -->
<div class="col-md-8 col-lg-6 mx-auto mb-5">
  <div class="card shadow-sm border-0">
    <div class="card-header text-center" style="background-color: var(--c-primary); color: var(--c-light);">
      <h2 class="mb-0">Contact Us</h2>
    </div>
    <div class="card-body p-4">
      <form onsubmit="formSubmit(event)">
        <div class="form-group mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control shadow-sm" id="name" placeholder="Enter your name" required style="background-color: var(--c-light); border-color: var(--c-secondary);">
        </div>
        <div class="form-group mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control shadow-sm" id="email" placeholder="Enter your email" required style="background-color: var(--c-light); border-color: var(--c-secondary);">
        </div>
        <div class="form-group mb-3">
          <label for="inquiryType" class="form-label">Inquiry Type</label>
          <select class="form-select shadow-sm" id="inquiryType" required style="background-color: var(--c-light); border-color: var(--c-secondary);">
            <option value="" disabled selected>Select your inquiry type</option>
            <option value="general">General Inquiry</option>
            <option value="donation">Donation Inquiry</option>
            <option value="sponsorship">Sponsorship Inquiry</option>
          </select>
        </div>
        <div class="form-group mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control shadow-sm" id="message" rows="4" placeholder="Your message" required style="background-color: var(--c-light); border-color: var(--c-secondary);"></textarea>
        </div>
        <button type="submit" class="btn w-100 shadow-sm mt-3" style="background-color: var(--c-dark); color: var(--c-light);">Submit</button>
      </form>
    </div>
  </div>
</div>
<!-- Contact Form End -->


      <!-- Donut Chart Start -->
      <div class="col-md-6">
        <div class="border p-3 rounded bg-light">
          <h2 class="text-center mb-4 bg-c-primary text-c-light p-3">Our current goal</h2>
          <canvas id="donutChart"></canvas>
          <div class="text-center mt-3">
            <p class="font-weight-bold" >44k $ / 50k $ </p>
            <a href="donate.html" class="btn btn-secondary text-light ">Learn more</a>
          </div>
        </div>
      </div>
      <!-- Donut Chart End -->
    </div>
  </div>
  <!--Content container end-->

  <!--Footer start here-->
<footer class="text-center mt-auto py-0">
  <div class="footer-social mb-1">
    <footer class="text-center">
      <div class="footer-social">
        <a href="https://www.facebook.com" class="mx-2" ><i class="fab fa-facebook-f"><p class="font-family"> Facebook</p></i></a>
        <a href="https://www.instagram.com" class="mx-2" ><i class="fab fa-instagram"><p class="font-family"> Instagram</p></i></a>
        <a href="https://www.x.com" class="mx-2" ><i class="fab fa-twitter"><p class="font-family"> X</p></i></a>
        <a href="https://www.snapchat.com" class="mx-2" ><i class="fab fa-snapchat-ghost"><p class="font-family"> Snapchat</p></i></a>
        <a href="https://www.youtube.com" class="mx-2" ><i class="fab fa-youtube"><p class="font-family"> Youtube</p></i></a>
        <a href="https://www.tiktok.com" class="mx-2" ><i class="fab fa-tiktok"><p class="font-family"> TikTok</p></i></a>
      </div>
      <p class="copyright mt-2 mb-1">
        © 2024 JFF Biodiversity Bootstrap Website. All rights reserved.
      </p>
    </footer>
  </div>
</footer>
<!-- Footer End -->

<!-- Custom CSS for Footer -->
<style>
  .footer-social a {
    display: inline-flex;
    align-items: center;
    font-size: 0.8rem; /* Smaller text for links */
    text-decoration: none;
  }

  .footer-social i {
    font-size: 1rem; /* Smaller icon size */
    margin-right: 4px;
  }

  .footer-text {
    font-size: 0.8rem; /* Smaller text beside the icons */
  }
</style>

    </div>
  
  </footer>
  <!--Footer end here-->
</body>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

 <script src="JS/script.js"></script>
  
<!-- JavaScript searchbar -->
<script>
  function handleSearch(event) {
    event.preventDefault();
    const searchTerm = event.target[0].value;
    alert('You searched for: ' + searchTerm);
  }

  function formSubmit(event) {
    alert('Thank you for your message.');
  }
</script>
  <!--Scripts end-->
</body>

</html>
